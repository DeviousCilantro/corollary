# Builds the site and publishes it to GitHub Pages on every push to main.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". The first run fails until that is set; re-run it after.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Test the generator
        run: cargo test -p sitegen

      # Tells the build where Pages will serve the site, including the
      # /repository-name/ subpath of a project site, so that no base_url needs
      # to be written by hand. A base_url set in content/site.toml wins.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build static site
        run: ./scripts/build.sh
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
